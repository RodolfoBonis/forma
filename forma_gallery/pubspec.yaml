name: forma_gallery
description: Forma Design System — gallery & docs showcase (custom, no Widgetbook).
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.8.0
  forma_core: ^3.0.0
  forma_theme_plantao_facil: ^3.0.0
  forma_theme_dominus: ^3.0.0
  forma_theme_spooliq: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  google_fonts: ^6.2.1

flutter:
  uses-material-design: true
