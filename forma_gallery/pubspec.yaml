    sdk: flutter
  forma_core: ^1.0.0
  forma_theme_plantao_facil: ^1.0.0
  forma_theme_dominus: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
