name: forma_storybook
description: Forma Design System — Widgetbook visual documentation.
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  widgetbook: ^3.12.0
  forma_core: ^1.0.0
  forma_theme_plantao_facil: ^1.0.0
  forma_theme_dominus: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  widgetbook_annotation: ^3.2.0
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
