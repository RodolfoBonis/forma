name: forma_theme_spooliq
description: SpoolIQ (coral + teal, light & dark, desktop density) theme variant for the Forma Design System.
version: 0.1.0
publish_to: https://pub.rodolfodebonis.com.br
repository: https://github.com/RodolfoBonis/forma
resolution: workspace

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  forma_foundation: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
