name: forma_foundation
description: >
  Forma Design System — foundation layer: design tokens (spacing, radius,
  typography, durations), the theme engine, and the FormaThemeExtension color
  contract. Brand-agnostic, component-free.
version: 2.0.0
publish_to: https://pub.rodolfodebonis.com.br
resolution: workspace

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
