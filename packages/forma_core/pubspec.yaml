name: forma_core
description: >
  Forma Design System — compatibility facade re-exporting forma_foundation and
  forma_ui, plus transitional app-specific components pending extraction.
  Prefer depending on forma_foundation / forma_ui / forma_icons directly.
version: 2.0.1
publish_to: https://pub.rodolfodebonis.com.br
repository: https://github.com/RodolfoBonis/forma
resolution: workspace

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  forma_foundation: ^2.0.1
  forma_ui: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
