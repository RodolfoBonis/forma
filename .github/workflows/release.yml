name: Release & Publish

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: CI
        run: melos run ci

  release:
    name: Release & Publish
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read current versions
        id: version
        run: |
          CORE_VERSION=$(grep '^version:' packages/forma_core/pubspec.yaml | awk '{print $2}')
          THEME_VERSION=$(grep '^version:' packages/forma_theme_plantao_facil/pubspec.yaml | awk '{print $2}')
          echo "core_version=$CORE_VERSION" >> $GITHUB_OUTPUT
          echo "theme_version=$THEME_VERSION" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${LAST_TAG}..HEAD"
          fi

          CORE_VERSION=${{ steps.version.outputs.core_version }}
          THEME_VERSION=${{ steps.version.outputs.theme_version }}

          cat > /tmp/release_notes.md << NOTES
          ## Packages

          | Package | Version |
          |---------|---------|
          | \`forma_core\` | v${CORE_VERSION} |
          | \`forma_theme_plantao_facil\` | v${THEME_VERSION} |

          ## Changes
          NOTES

          git log $RANGE --pretty=format:"- %s" --no-merges >> /tmp/release_notes.md

      - name: Check if release exists
        id: check
        run: |
          CORE_VERSION=${{ steps.version.outputs.core_version }}
          if gh release view "v${CORE_VERSION}" --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Git tag & GitHub Release
        if: steps.check.outputs.exists == 'false'
        run: |
          CORE_VERSION=${{ steps.version.outputs.core_version }}
          THEME_VERSION=${{ steps.version.outputs.theme_version }}

          # Create package-level tags
          git tag "forma_core-v${CORE_VERSION}" 2>/dev/null || true
          git tag "forma_theme_plantao_facil-v${THEME_VERSION}" 2>/dev/null || true
          git tag "v${CORE_VERSION}" 2>/dev/null || true
          git push --tags

          gh release create "v${CORE_VERSION}" \
            --title "v${CORE_VERSION}" \
            --notes-file /tmp/release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure pub token
        run: dart pub token add https://pub.rodolfodebonis.com.br --env-var PUB_TOKEN
        env:
          PUB_TOKEN: ${{ secrets.PUB_TOKEN }}

      - name: Publish forma_core
        if: steps.check.outputs.exists == 'false'
        run: |
          cp -r packages/forma_core /tmp/forma_core_publish
          cd /tmp/forma_core_publish
          sed -i '/^resolution: workspace$/d' pubspec.yaml
          dart pub publish --force
          rm -rf /tmp/forma_core_publish

      - name: Publish forma_theme_plantao_facil
        if: steps.check.outputs.exists == 'false'
        run: |
          CORE_VERSION=${{ steps.version.outputs.core_version }}
          cp -r packages/forma_theme_plantao_facil /tmp/theme_publish
          cd /tmp/theme_publish

          # Remove workspace resolution
          sed -i '/^resolution: workspace$/d' pubspec.yaml

          # Point forma_core to hosted private pub
          python3 -c "
          import re
          with open('pubspec.yaml', 'r') as f:
              content = f.read()
          content = re.sub(
              r'  forma_core: \^.*',
              '  forma_core:\\n    hosted:\\n      name: forma_core\\n      url: https://pub.rodolfodebonis.com.br\\n    version: ^${CORE_VERSION}',
              content
          )
          with open('pubspec.yaml', 'w') as f:
              f.write(content)
          "

          dart pub publish --force
          rm -rf /tmp/theme_publish
