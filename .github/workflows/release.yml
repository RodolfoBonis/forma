name: Release & Publish

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI Check
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: CI
        run: melos run ci

  release:
    name: Release & Publish
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute next version from conventional commits
        id: version
        run: |
          set -euo pipefail

          LAST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1 || true)
          if [ -z "$LAST_TAG" ]; then
            LAST_VERSION="0.0.0"
            RANGE="HEAD"
          else
            LAST_VERSION="${LAST_TAG#v}"
            RANGE="${LAST_TAG}..HEAD"
          fi
          echo "Last tag: ${LAST_TAG:-<none>} (version ${LAST_VERSION})"

          COMMITS=$(git log "$RANGE" --pretty=format:'%s%n%b%n---' --no-merges || true)

          BUMP="patch"
          if echo "$COMMITS" | grep -qiE '(^|\s)BREAKING[-_ ]CHANGE:' \
             || echo "$COMMITS" | grep -qE '^[a-zA-Z]+(\([^)]+\))?!:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^feat(\([^)]+\))?:'; then
            BUMP="minor"
          fi
          echo "Detected bump: $BUMP"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_VERSION"
          case "$BUMP" in
            major) NEW_VERSION="$((MAJOR+1)).0.0" ;;
            minor) NEW_VERSION="${MAJOR}.$((MINOR+1)).0" ;;
            patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
          esac
          echo "New version: $NEW_VERSION"

          echo "last_version=$LAST_VERSION" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "range=$RANGE" >> $GITHUB_OUTPUT

      # Published packages, in topological (publish) order. Each consuming
      # package is published after its internal dependencies so the hosted
      # versions resolve.
      - name: Bump pubspec versions
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          for f in \
            packages/forma_foundation/pubspec.yaml \
            packages/forma_icons/pubspec.yaml \
            packages/forma_ui/pubspec.yaml \
            packages/forma_core/pubspec.yaml \
            packages/forma_theme_plantao_facil/pubspec.yaml \
            packages/forma_theme_dominus/pubspec.yaml; do
            sed -i -E "s/^version: .*/version: ${NEW_VERSION}/" "$f"
          done

          # Keep internal dependency constraints in sync with the new version so
          # the melos workspace keeps resolving — a major bump would otherwise
          # leave consumers pinned to ^old and break `melos bootstrap`.
          for f in $(git ls-files '*pubspec.yaml'); do
            for name in forma_foundation forma_icons forma_ui forma_core \
                        forma_theme_plantao_facil forma_theme_dominus; do
              sed -i -E "s|^(  ${name}): \^[0-9].*|\1: ^${NEW_VERSION}|" "$f"
            done
          done
          git diff --stat

      - name: Commit version bump
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          # Stage only the pubspec.yaml files we may have changed (never the
          # pubspec.lock that `melos bootstrap` dirties), then commit only if
          # something is actually staged. On a re-release at the same version
          # there is nothing to commit and we skip cleanly.
          git add -- $(git ls-files '*pubspec.yaml')
          if git diff --cached --quiet; then
            echo "No pubspec changes to commit; skipping bump commit."
          else
            git commit -m "chore(release): v${NEW_VERSION} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Generate release notes
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          RANGE: ${{ steps.version.outputs.range }}
        run: |
          cat > /tmp/release_notes.md << NOTES
          ## Packages

          | Package | Version |
          |---------|---------|
          | \`forma_foundation\` | v${NEW_VERSION} |
          | \`forma_icons\` | v${NEW_VERSION} |
          | \`forma_ui\` | v${NEW_VERSION} |
          | \`forma_core\` | v${NEW_VERSION} |
          | \`forma_theme_plantao_facil\` | v${NEW_VERSION} |
          | \`forma_theme_dominus\` | v${NEW_VERSION} |

          ## Changes
          NOTES

          git log $RANGE --pretty=format:"- %s" --no-merges >> /tmp/release_notes.md

      - name: Create Git tag & GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          set -euo pipefail

          tag_if_absent() {
            if git rev-parse -q --verify "refs/tags/$1" >/dev/null; then
              echo "tag $1 already exists, skipping"
            else
              git tag "$1"
            fi
          }

          for pkg in forma_foundation forma_icons forma_ui forma_core \
                     forma_theme_plantao_facil forma_theme_dominus; do
            tag_if_absent "${pkg}-v${NEW_VERSION}"
          done
          tag_if_absent "v${NEW_VERSION}"
          git push --tags

          if gh release view "v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "release v${NEW_VERSION} already exists, skipping"
          else
            gh release create "v${NEW_VERSION}" \
              --title "v${NEW_VERSION}" \
              --notes-file /tmp/release_notes.md
          fi

      - name: Configure pub token
        run: dart pub token add https://pub.rodolfodebonis.com.br --env-var PUB_TOKEN
        env:
          PUB_TOKEN: ${{ secrets.PUB_TOKEN }}

      - name: Publish packages (topological order)
        env:
          PUB_TOKEN: ${{ secrets.PUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          # Internal packages whose deps must be rewritten to the hosted server.
          INTERNAL_PKGS: forma_foundation forma_icons forma_ui forma_core
          PUB_URL: https://pub.rodolfodebonis.com.br
        run: |
          set -euo pipefail

          REWRITE="$(pwd)/scripts/rewrite_pub_deps.py"

          already_published() {
            # True when version $2 of package $1 is already on the pub server.
            curl -fsSL "${PUB_URL}/api/packages/$1" 2>/dev/null \
              | grep -qE "\"version\"[[:space:]]*:[[:space:]]*\"$2\""
          }

          publish_pkg() {
            local pkg="$1"
            if already_published "${pkg}" "${NEW_VERSION}"; then
              echo "${pkg} ${NEW_VERSION} already published, skipping"
              return
            fi
            echo "::group::Publishing ${pkg}"
            rm -rf "/tmp/pub_${pkg}"
            cp -r "packages/${pkg}" "/tmp/pub_${pkg}"
            # Copying to /tmp loses the .gitignore context, so strip local
            # build/tooling artifacts to keep the published archive lean.
            rm -rf "/tmp/pub_${pkg}/.dart_tool" "/tmp/pub_${pkg}/build" \
                   "/tmp/pub_${pkg}/coverage" \
                   "/tmp/pub_${pkg}/.flutter-plugins-dependencies"
            find "/tmp/pub_${pkg}" -name '*.iml' -delete
            ( cd "/tmp/pub_${pkg}"
              sed -i '/^resolution: workspace$/d' pubspec.yaml
              python3 "$REWRITE" pubspec.yaml
              dart pub publish --dry-run
              dart pub publish --force
            )
            rm -rf "/tmp/pub_${pkg}"
            echo "::endgroup::"
          }

          for pkg in forma_foundation forma_icons forma_ui forma_core \
                     forma_theme_plantao_facil forma_theme_dominus; do
            publish_pkg "$pkg"
          done
