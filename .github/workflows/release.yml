name: Release & Publish

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI Check
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: CI
        run: melos run ci

  release:
    name: Release & Publish
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute next version from conventional commits
        id: version
        run: |
          set -euo pipefail

          LAST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1 || true)
          if [ -z "$LAST_TAG" ]; then
            LAST_VERSION="0.0.0"
            RANGE="HEAD"
          else
            LAST_VERSION="${LAST_TAG#v}"
            RANGE="${LAST_TAG}..HEAD"
          fi
          echo "Last tag: ${LAST_TAG:-<none>} (version ${LAST_VERSION})"

          COMMITS=$(git log "$RANGE" --pretty=format:'%s%n%b%n---' --no-merges || true)

          BUMP="patch"
          if echo "$COMMITS" | grep -qiE '(^|\s)BREAKING[-_ ]CHANGE:' \
             || echo "$COMMITS" | grep -qE '^[a-zA-Z]+(\([^)]+\))?!:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^feat(\([^)]+\))?:'; then
            BUMP="minor"
          fi
          echo "Detected bump: $BUMP"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_VERSION"
          case "$BUMP" in
            major) NEW_VERSION="$((MAJOR+1)).0.0" ;;
            minor) NEW_VERSION="${MAJOR}.$((MINOR+1)).0" ;;
            patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
          esac
          echo "New version: $NEW_VERSION"

          echo "last_version=$LAST_VERSION" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "range=$RANGE" >> $GITHUB_OUTPUT

      # Published packages, in topological (publish) order. Each consuming
      # package is published after its internal dependencies so the hosted
      # versions resolve.
      - name: Bump pubspec versions
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          for f in \
            packages/forma_foundation/pubspec.yaml \
            packages/forma_icons/pubspec.yaml \
            packages/forma_ui/pubspec.yaml \
            packages/forma_core/pubspec.yaml \
            packages/forma_theme_plantao_facil/pubspec.yaml \
            packages/forma_theme_dominus/pubspec.yaml; do
            sed -i -E "s/^version: .*/version: ${NEW_VERSION}/" "$f"
          done
          git diff --stat

      - name: Commit version bump
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          if git diff --quiet; then
            echo "No version change detected; skipping bump commit."
          else
            git add packages/*/pubspec.yaml
            git commit -m "chore(release): v${NEW_VERSION} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Generate release notes
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          RANGE: ${{ steps.version.outputs.range }}
        run: |
          cat > /tmp/release_notes.md << NOTES
          ## Packages

          | Package | Version |
          |---------|---------|
          | \`forma_foundation\` | v${NEW_VERSION} |
          | \`forma_icons\` | v${NEW_VERSION} |
          | \`forma_ui\` | v${NEW_VERSION} |
          | \`forma_core\` | v${NEW_VERSION} |
          | \`forma_theme_plantao_facil\` | v${NEW_VERSION} |
          | \`forma_theme_dominus\` | v${NEW_VERSION} |

          ## Changes
          NOTES

          git log $RANGE --pretty=format:"- %s" --no-merges >> /tmp/release_notes.md

      - name: Create Git tag & GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          for pkg in forma_foundation forma_icons forma_ui forma_core \
                     forma_theme_plantao_facil forma_theme_dominus; do
            git tag "${pkg}-v${NEW_VERSION}"
          done
          git tag "v${NEW_VERSION}"
          git push --tags

          gh release create "v${NEW_VERSION}" \
            --title "v${NEW_VERSION}" \
            --notes-file /tmp/release_notes.md

      - name: Configure pub token
        run: dart pub token add https://pub.rodolfodebonis.com.br --env-var PUB_TOKEN
        env:
          PUB_TOKEN: ${{ secrets.PUB_TOKEN }}

      - name: Publish packages (topological order)
        env:
          PUB_TOKEN: ${{ secrets.PUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          # Internal packages whose deps must be rewritten to the hosted server.
          INTERNAL_PKGS: forma_foundation forma_icons forma_ui forma_core
          PUB_URL: https://pub.rodolfodebonis.com.br
        run: |
          set -euo pipefail

          REWRITE="$(pwd)/scripts/rewrite_pub_deps.py"

          publish_pkg() {
            local pkg="$1"
            echo "::group::Publishing ${pkg}"
            rm -rf "/tmp/pub_${pkg}"
            cp -r "packages/${pkg}" "/tmp/pub_${pkg}"
            ( cd "/tmp/pub_${pkg}"
              sed -i '/^resolution: workspace$/d' pubspec.yaml
              python3 "$REWRITE" pubspec.yaml
              dart pub publish --dry-run
              dart pub publish --force
            )
            rm -rf "/tmp/pub_${pkg}"
            echo "::endgroup::"
          }

          for pkg in forma_foundation forma_icons forma_ui forma_core \
                     forma_theme_plantao_facil forma_theme_dominus; do
            publish_pkg "$pkg"
          done
