name: Release & Publish

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI Check
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: CI
        run: melos run ci

  release:
    name: Release & Publish
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute next version from conventional commits
        id: version
        run: |
          set -euo pipefail

          LAST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1 || true)
          if [ -z "$LAST_TAG" ]; then
            LAST_VERSION="0.0.0"
            RANGE="HEAD"
          else
            LAST_VERSION="${LAST_TAG#v}"
            RANGE="${LAST_TAG}..HEAD"
          fi
          echo "Last tag: ${LAST_TAG:-<none>} (version ${LAST_VERSION})"

          COMMITS=$(git log "$RANGE" --pretty=format:'%s%n%b%n---' --no-merges || true)

          BUMP="patch"
          if echo "$COMMITS" | grep -qiE '(^|\s)BREAKING[-_ ]CHANGE:' \
             || echo "$COMMITS" | grep -qE '^[a-zA-Z]+(\([^)]+\))?!:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^feat(\([^)]+\))?:'; then
            BUMP="minor"
          fi
          echo "Detected bump: $BUMP"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_VERSION"
          case "$BUMP" in
            major) NEW_VERSION="$((MAJOR+1)).0.0" ;;
            minor) NEW_VERSION="${MAJOR}.$((MINOR+1)).0" ;;
            patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
          esac
          echo "New version: $NEW_VERSION"

          echo "last_version=$LAST_VERSION" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "range=$RANGE" >> $GITHUB_OUTPUT

      - name: Bump pubspec versions
        run: |
          NEW_VERSION=${{ steps.version.outputs.new_version }}
          for f in packages/forma_core/pubspec.yaml packages/forma_theme_plantao_facil/pubspec.yaml; do
            sed -i -E "s/^version: .*/version: ${NEW_VERSION}/" "$f"
          done
          git diff --stat

      - name: Commit version bump
        run: |
          NEW_VERSION=${{ steps.version.outputs.new_version }}
          if git diff --quiet; then
            echo "No version change detected; skipping bump commit."
          else
            git add packages/forma_core/pubspec.yaml packages/forma_theme_plantao_facil/pubspec.yaml
            git commit -m "chore(release): v${NEW_VERSION} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Generate release notes
        run: |
          NEW_VERSION=${{ steps.version.outputs.new_version }}
          RANGE="${{ steps.version.outputs.range }}"

          cat > /tmp/release_notes.md << NOTES
          ## Packages

          | Package | Version |
          |---------|---------|
          | \`forma_core\` | v${NEW_VERSION} |
          | \`forma_theme_plantao_facil\` | v${NEW_VERSION} |

          ## Changes
          NOTES

          git log $RANGE --pretty=format:"- %s" --no-merges >> /tmp/release_notes.md

      - name: Create Git tag & GitHub Release
        run: |
          NEW_VERSION=${{ steps.version.outputs.new_version }}

          git tag "forma_core-v${NEW_VERSION}"
          git tag "forma_theme_plantao_facil-v${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git push --tags

          gh release create "v${NEW_VERSION}" \
            --title "v${NEW_VERSION}" \
            --notes-file /tmp/release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure pub token
        run: dart pub token add https://pub.rodolfodebonis.com.br --env-var PUB_TOKEN
        env:
          PUB_TOKEN: ${{ secrets.PUB_TOKEN }}

      - name: Publish forma_core
        env:
          PUB_TOKEN: ${{ secrets.PUB_TOKEN }}
        run: |
          cp -r packages/forma_core /tmp/forma_core_publish
          cd /tmp/forma_core_publish
          sed -i '/^resolution: workspace$/d' pubspec.yaml
          dart pub publish --force
          rm -rf /tmp/forma_core_publish

      - name: Publish forma_theme_plantao_facil
        env:
          PUB_TOKEN: ${{ secrets.PUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          cp -r packages/forma_theme_plantao_facil /tmp/theme_publish
          cd /tmp/theme_publish

          # Remove workspace resolution
          sed -i '/^resolution: workspace$/d' pubspec.yaml

          # Point forma_core to hosted private pub
          python3 -c "
          import os, re
          version = os.environ['NEW_VERSION']
          with open('pubspec.yaml', 'r') as f:
              content = f.read()
          content = re.sub(
              r'  forma_core: \^.*',
              f'  forma_core:\n    hosted:\n      name: forma_core\n      url: https://pub.rodolfodebonis.com.br\n    version: ^{version}',
              content
          )
          with open('pubspec.yaml', 'w') as f:
              f.write(content)
          "

          dart pub publish --force
          rm -rf /tmp/theme_publish
