name: Gallery Deploy

on:
  # Deploy when a release is published. Release · Publish creates the umbrella
  # GitHub Release (final = not a prerelease); RC releases are skipped by the
  # job guard below. Also runnable on demand.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: gallery
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy Gallery
    # Skip release-candidate (prerelease) umbrella releases — deploy finals only.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: arc-forma
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Build Gallery
        run: melos run gallery:build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: forma_gallery/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
