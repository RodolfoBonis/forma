name: Gallery Deploy

on:
  # Deploy whenever a release is published (the release workflow creates it).
  # The fast-forward bump commit on main carries [skip ci], which would skip a
  # push-triggered deploy — the release event avoids that.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: gallery
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy Gallery
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Build Gallery
        run: melos run gallery:build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: forma_gallery/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
